<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=send" />
</head>
<body>
    <header>
        <h1>
            Send Us A Message
        </h1>
    </header>
    
    <main>
        <form action="mailto:muhammadnoman5860@gmail.com" method="post" enctype="text/plain">
            <input type="text" id="Name" placeholder="Full Name" required>

            <input type="email" id="Email" placeholder="Email" required>

            <input type="number" id="Phone" placeholder="Phone" required>
                     
            <textarea name="Message" id="Message" placeholder="Message"></textarea>

            <input class="material-symbols-outlined" type="submit" value="send">
            <input class="button" type="reset" value="Clear">
        </form>
    </main>
</body>
</html>
