<svg width="120" height="80" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8bbd0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ce93d8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="frontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff1744;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6200ea;stop-opacity:1" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="5" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="80" width="220" height="220" rx="40" fill="url(#backGrad)" />
    <circle cx="145" cy="155" r="12" fill="#5d4037" />
    <circle cx="275" cy="155" r="12" fill="#5d4037" />
    <path d="M 180 205 Q 210 225 240 205" stroke="#5d4037" stroke-width="8" stroke-linecap="round" fill="transparent" />
  </g>

  <g filter="url(#shadow)">
    <rect x="210" y="200" width="220" height="220" rx="40" fill="url(#frontGrad)" />
    <circle cx="255" cy="275" r="12" fill="white" />
    <circle cx="385" cy="275" r="12" fill="white" />
    <path d="M 290 325 Q 340 355 390 325" stroke="white" stroke-width="8" stroke-linecap="round" fill="transparent" />
  </g>
</svg>
