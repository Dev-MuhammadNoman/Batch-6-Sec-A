
<svg width="110" height="100" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff1744;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6200ea;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="lensGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f48fb1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ad1457;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff5252;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b71c1c;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
  </defs>

  <path d="M160 180 l3 7 h8 l-6 5 l2 8 l-7-5 l-7 5 l2-8 l-6-5 h8 z" fill="url(#starGrad)" transform="rotate(-15 160 180)"/>
  <path d="M380 380 l4 10 h11 l-9 7 l3 11 l-9-7 l-9 7 l3-11 l-9-7 h11 z" fill="url(#starGrad)" />
  <path d="M130 310 l3 7 h8 l-6 5 l2 8 l-7-5 l-7 5 l2-8 l-6-5 h8 z" fill="#880e4f" transform="rotate(10 130 310)"/>

  <g transform="rotate(-35 250 250)">
    <rect x="120" y="225" width="40" height="50" rx="10" fill="#4a148c" />
    <rect x="150" y="215" width="80" height="70" rx="15" fill="url(#bodyGrad)" />
    <rect x="220" y="190" width="140" height="120" rx="20" fill="url(#bodyGrad)" />
    
    <rect x="230" y="200" width="120" height="30" rx="10" fill="url(#shine)" />

    <ellipse cx="360" cy="250" rx="30" ry="60" fill="#fce4ec" />
    <ellipse cx="355" cy="250" rx="25" ry="55" fill="url(#lensGrad)" />
    <circle cx="365" cy="230" r="10" fill="white" fill-opacity="0.3" />
  </g>
</svg>
