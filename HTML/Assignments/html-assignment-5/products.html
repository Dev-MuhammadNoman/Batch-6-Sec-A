<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroMart Digital Store</title>
</head>
<body>
    <center>
    <style>
        th, td {border: 1px solid black; height: 30px; width: 150px;}
    </style>
    <!-- Store Name -->
    <H1>ElectroMart – Product Price List</H1>

    <!-- Tables -->
     <table>
        <thead>
            <tr>
                <th>Product</th>                
                <th>Category</th>                
                <th>Price</th>                
                <th>Stock</th>             
                <th>Quantity</th>
            </tr>
        </thead>
        
        <tbody>
            <tr>
                <th>Google Pixel 8</th>
                <td rowspan="2">Mobile</td>
                <td>Rs. 85,000</td>
                <td>Yes</td>
                <th>x9</th>
            </tr>
            <tr>
                <th>Sony Xperia 1 V</th>
                <td>Rs. 80,000</td>
                <td>Yes</td>
                <th>x7</th>
            </tr>
            <tr>
                <th>Dell Precision</th>
                <td>Workstaion</td>
                <td>Rs. 45,000</td>
                <td>Yes</td>
                <th>x5</th>
            </tr>
            <tr>
                <th>MacBook Pro</th>
                <td>Laptop</td>
                <td>Rs. 40,000</td>
                <td>No</td>
                <th>x0</th>
            </tr>
            
        </tbody>
        
        <tfoot>
            <tr>
                <th colspan="2">Subtotal</th>
                <th colspan="3">Rs. 210,000</th>
            </tr>
        </tfoot>
     </table>
     </center>
</body>
</html>
